<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f7f1ec" />
  <title>Wisdom Vault — Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFCF5;
      color: #121212;
      font-family: 'Inter', sans-serif;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .offline-card {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .offline-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 32px;
      border-radius: 50%;
      background: rgba(255, 180, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .offline-icon svg {
      width: 36px;
      height: 36px;
      stroke: #FFB400;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .offline-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .offline-subtitle {
      font-size: 15px;
      color: rgba(18, 18, 18, 0.5);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .offline-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 40px;
      background: #121212;
      color: #FFFCF5;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .offline-btn:hover {
      background: #2a2a2a;
      transform: translateY(-1px);
    }

    .offline-btn svg {
      width: 16px;
      height: 16px;
      stroke: #FFFCF5;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .offline-hint {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(18, 18, 18, 0.3);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1 class="offline-title">You're Offline</h1>
    <p class="offline-subtitle">
      It looks like you've lost your internet connection.<br />
      Check your network and try again.
    </p>
    <button class="offline-btn" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
      Retry
    </button>
    <p class="offline-hint">Wisdom will be here when you reconnect.</p>
  </div>
</body>
</html>
